<html lang="en">
<head>
<meta charset="UTF-8">

<title>One Step Closer</title>

<style>

*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#f5f7fb,#eef3fa);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
.believe-header{width:100%;height:220px;overflow:hidden;background:#07558a;box-shadow:0 4px 18px rgba(30,55,90,.12)}

.wrap{max-width:1180px;margin:auto;padding:10px 20px 55px}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:10px}
h1{font-size:32px;line-height:1.1;margin:0;letter-spacing:-.7px}.sub{color:var(--muted);font-size:14px;margin-top:6px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#e8edf5;color:#263650;cursor:pointer;transition:.15s}
button:hover{filter:brightness(.98);transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.nav{display:flex;gap:9px;align-items:center;margin:18px 0 14px}.nav button{font-size:20px;padding:8px 13px}.datepick{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font:inherit}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.maincol,.sidecol{min-width:0}

.progress-top{display:flex;justify-content:space-between;align-items:end;gap:12px}.pct-large{font-size:28px;font-weight:800}.progress-label{color:var(--muted);font-size:15px}.bar{height:10px;background:#e8edf4;border-radius:20px;overflow:hidden;margin-top:11px}.fill{height:100%;background:linear-gradient(90deg,#71c7d1,var(--accent));transition:.25s}

/* Flow of the Day Section */

.flow-slot{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:11px;display:flex;flex-direction:column}
.flow-slot-title{font-size:12px;font-weight:800;text-transform:uppercase;color:#64748b;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.flow-slot-time{font-size:11px;font-weight:700;color:var(--accent);background:#eef2ff;padding:2px 6px;border-radius:6px}
.flow-items{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.flow-select-row{display:flex;align-items:center;gap:6px}
.flow-slot select{flex:1;min-width:0;padding:7px 8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#1e293b;font-weight:700;font-size:13px}
.flow-del-btn{border:1px solid #e2e8f0;background:#fff;color:#94a3b8;font-size:13px;padding:5px 8px;border-radius:7px;cursor:pointer;line-height:1}
.flow-del-btn:hover{color:#b91c1c;background:#fee2e2;border-color:#fca5a5}
.flow-add-btn{margin-top:auto;border:1px dashed #cbd5e1;background:transparent;color:var(--accent);font-size:12px;padding:6px;border-radius:8px;cursor:pointer;font-weight:700;text-align:center;transition:.15s}
.flow-add-btn:hover{background:#f1f5f9;border-color:var(--accent)}

.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:visible;box-shadow:0 5px 18px rgba(37,55,82,.04)}
.head{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid transparent}.name{font-weight:800;flex:1;font-size:17px}.count{font-size:13px;color:var(--muted)}
.cat-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px}
.head button{padding:6px 8px;background:transparent;color:var(--muted)}.head .collapse{font-size:18px;color:#8190aa}
.tasks{padding:0 16px 12px}.task{display:flex;gap:11px;align-items:center;border-top:1px solid var(--line);padding:11px 0;cursor:pointer;flex-wrap:wrap}
.task input{width:19px;height:19px;accent-color:var(--accent);flex:none;cursor:pointer}
.task-text{flex:1;cursor:pointer}.task-actions{display:flex;gap:5px;align-items:center;margin-left:auto;position:relative}
.task-action{font-size:11px;padding:4px 7px;border:1px solid #d7dde7;background:#fff;color:#5f6d82;border-radius:7px;cursor:pointer}
.task-action.delete{color:#b35d5d;border-color:#ead2d2}.task-action:hover{background:#f7f9fc}.done{text-decoration:line-through;color:#979fac}
.task-pct{font-size:12px;color:var(--muted);min-width:32px;text-align:right}
.subtasks{margin:0 0 5px 30px;border-left:2px solid #edf0f5;padding-left:12px}
.subtask{display:flex;align-items:center;gap:9px;padding:7px 0;color:#52627b;font-size:13px;flex-wrap:wrap}
.subtask input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}.subtask-text{flex:1;cursor:pointer}
.subadd-wrap{margin:0 0 5px 30px;padding-left:14px}
.subinput-row{display:flex;gap:6px;align-items:center;margin:4px 0 7px}
.subinput{flex:1;min-width:0;border:1px solid #cfd6e2;border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;background:#fff}
.subsave,.subcancel{font-size:12px;padding:6px 9px}.subsave{background:var(--accent);color:#fff;border-color:var(--accent)}.subcancel{background:#fff;color:var(--muted)}
.subadd{display:block;margin:0 0 5px auto;border:1px dashed #d7dde7;background:transparent;color:var(--muted);font-size:12px;padding:5px 9px}

/* Time Block Badges & Dropdown */
.block-tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;display:inline-flex;align-items:center;margin-left:6px;vertical-align:middle}
.block-morning{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
.block-noon{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd}
.block-evening{background:#f3e8ff;color:#6b21a8;border:1px solid #e9d5ff}
.block-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);min-width:215px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);gap:4px;z-index:200}
.block-menu.open{display:flex;flex-direction:column}
.block-opt{border:1px solid transparent;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:700;text-align:left;background:#f8fafc;color:#334155;cursor:pointer}
.block-opt:hover{background:#f1f5f9}
.block-opt.clear{color:#b91c1c;background:#fff}

.mock-top{display:grid;grid-template-columns:minmax(150px,1.5fr) minmax(100px,1fr) minmax(110px,1fr);gap:7px}
.mock-subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}
.mock-field{min-width:0}
.mock-field label small{font-size:9px;font-weight:600;text-transform:none;letter-spacing:0;color:#9aa5b5}

.mock-field input{width:100%;box-sizing:border-box;border:1px solid #d4dae4;border-radius:8px;padding:8px 9px;font:inherit;font-size:13px;background:#fff}

.mocksave{background:var(--accent);color:#fff;border-color:var(--accent)}.mockcancel{background:#fff;color:var(--muted)}
.mock-list{margin:0 0 7px 0}

.mock-card-name{font-weight:800;color:#33445e}
.mock-subject-scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.mock-score{font-size:12px;color:#52627b;background:#fff;border:1px solid #e4e8ef;border-radius:8px;padding:6px 8px}
.mock-add-wrap{margin:7px 0 2px}
.subject-add{border:1px dashed #cbd3df;background:#fff;color:var(--muted);font-size:11px;padding:5px 8px}
.extra-subject-row{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:7px;margin-top:7px}
.mock-remarks{margin-top:8px}

  .mock-top{grid-template-columns:1fr}
  .mock-subjects{grid-template-columns:1fr 1fr 1fr}

.add{width:100%;border:1px dashed #cbd3df;background:transparent;color:var(--muted);margin-top:4px}
.actions{display:flex;flex-direction:column;gap:9px;margin:0}.actions button{width:100%;text-align:left;padding:12px 14px}.actions .primary{text-align:center}
.side-card{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px rgba(37,55,82,.04)}
.note{font-size:12px;color:var(--muted);margin-top:13px;line-height:1.5}
.quote{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;text-align:center;box-shadow:0 5px 18px rgba(37,55,82,.04)}
.quote-text{font-size:16px;font-weight:700;line-height:1.55;font-style:italic}.quote-author{font-size:13px;color:var(--muted);margin-top:6px}.quote-refresh{margin-top:11px;font-size:12px;padding:7px 10px}

.side-title{font-size:15px;font-weight:800;margin-bottom:10px}
@media(max-width:850px){
 .wrap{padding:16px 12px 45px}.layout{grid-template-columns:1fr}.sidecol{display:contents}.actions{order:3}.history{order:4}.side-card{order:3}.maincol{order:1}

}

 .sidecol{position:sticky;top:14px}

/* Stage Menu with Scroll and Practice Option */
.stage-picker{position:relative;display:flex;justify-content:flex-end;align-items:center;margin:5px 0 7px;z-index:25}
.task-stage{margin:4px 0 7px}
.mock-stage{margin:7px 0}
.stage-current{display:inline-flex;align-items:center;gap:7px;border:1px solid;border-radius:9px;padding:6px 11px;font-weight:800;font-size:12px;cursor:pointer;line-height:1;box-shadow:none}

.stage-current.mains,.stage-option.mains{background:#ffe27a;color:#6b5200;border-color:#e8c84a}
.stage-current.practice,.stage-option.practice{background:#e0f2fe;color:#0369a1;border-color:#7dd3fc}
.stage-chevron{font-size:11px;opacity:.8}
.stage-menu{display:none;position:absolute;right:0;top:calc(100% + 5px);min-width:115px;max-height:120px;overflow-y:auto;padding:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.15);gap:4px;z-index:100}
.stage-menu.open{display:flex;flex-direction:column}

.stage-option.selected{box-shadow:0 0 0 2px rgba(0,0,0,.08)}

.status-badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:10px}
.status-owner{background:#dbeafe;color:var(--accent)}
.status-view{background:#fef3c7;color:#d97706}
.sync-indicator{font-size:11px;font-weight:700;margin-left:8px;padding:2px 8px;border-radius:8px}
.sync-saving{background:#e0e7ff;color:#4338ca}
.sync-saved{background:#dcfce7;color:#15803d}
.sync-err{background:#fee2e2;color:#b91c1c}
.hidden{display:none !important}

/* Celebration Popup Modal */
.celebrate-overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s ease}
.celebrate-overlay.active{opacity:1;pointer-events:auto}
.celebrate-card{background:#fff;border-radius:22px;padding:34px 26px;max-width:440px;width:90%;text-align:center;box-shadow:0 22px 45px rgba(0,0,0,.22);transform:scale(.85);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.celebrate-overlay.active .celebrate-card{transform:scale(1)}
.celebrate-card h2{margin:8px 0 12px;font-size:26px;color:#1f2d45}
.celebrate-card p{font-size:16px;line-height:1.55;font-weight:600;color:#4b5563;margin:0 0 22px}
.celebrate-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer}

/* Chores Styles */
.chore-btn{background:#16a34a;color:#fff;font-size:11px;font-weight:800;padding:5px 11px;border-radius:8px;border:0;cursor:pointer;transition:.15s}
.chore-btn:hover{background:#15803d;transform:translateY(-1px)}
.chore-btn.done-btn{background:#e2e8f0;color:#64748b}
.empty-day-hint{font-size:13px;color:var(--muted);padding:12px 0 6px 4px;font-style:italic}
</style>
</head>
<body>
<header class="believe-header"><img src="BELIEVE.jpg" alt="Believe"></header>
<div class="wrap">

<div class="top">
  <div>
    <h1>One Step Closer</h1>
    <div class="sub">Study record & accountability</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button id="authBtn" class="primary" onclick="window.handleAuth()">Sign in with Google</button>
    <button id="resetDayBtn" onclick="window.resetDay()">Reset day</button>
  </div>
</div>

<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
  <div id="badge" class="status-badge hidden"></div>
  <span id="syncStatus" class="sync-indicator hidden"></span>
</div>

<div class="nav"><button onclick="window.shiftDate(-1)">‹</button><input id="date" class="datepick" type="date" onchange="window.selectDate(this.value)"><button onclick="window.shiftDate(1)">›</button><button onclick="window.goToday()">Today</button></div>

<div id="quote" class="quote"></div>

<div class="layout">
  <main class="maincol">
    <div class="progress">
      <div class="progress-top"><div><span id="pct" class="pct-large">0%</span> <span class="progress-label">complete</span></div><span id="cnt" style="color:#687995"></span></div>
      <div class="bar"><div id="fill" class="fill"></div></div>
    </div>
    <div id="flowOfTheDay"></div>
    <div id="app"></div>
  </main>

  <aside class="sidecol">
    <div class="side-card">
      <div class="actions">
        <button id="addCatBtn" class="primary" onclick="window.addCategory()">＋ &nbsp;Category</button>
        <button id="shareLiveBtn" onclick="window.shareLiveLink()">🔗 &nbsp; Share live link (WhatsApp)</button>
        <button onclick="window.backup()">⇩ &nbsp; Backup data</button>
        <button id="restoreBtn" onclick="window.restore()">⇧ &nbsp; Restore backup</button>
      </div>
      <div class="note" id="modeNote">Your data syncs in real-time. Click "Share live link" to let your partner view your progress without logging in.</div>
    </div>
    <div class="side-card history"><h2>Calendar / history</h2><div id="history"></div></div>
  </aside>
</div>
</div>

<!-- Celebration Modal -->
<div id="celebrateModal" class="celebrate-overlay" onclick="window.closeCelebration()">
  <div class="celebrate-card" onclick="event.stopPropagation()">
    <div style="font-size:48px;">🏆</div>
    <h2>Congratulations, Ay!</h2>
    <p>You are now One step closer to be the Greatest.</p>
    <button class="celebrate-btn" onclick="window.closeCelebration()">Keep Pushing</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    mocks: c.name.toLowerCase() === 'mock' ? [] : undefined
  }));

let data = JSON.parse(localStorage.getItem('accountability_backup') || JSON.stringify({ days: {} }));
if (!data.days || typeof data.days !== 'object') data.days = {};

let selected = new Date().toISOString().slice(0, 10);
let currentUser = null;
let isReadOnly = false;
let targetUid = null;
let unsubscribe = null;
let saveTimeout = null;
let hasCelebratedToday = false;

/* Celebration Audio File Path & Handle */
const CELEBRATION_AUDIO_SRC = 'celebration.mp3';
let activeCelebrationAudio = null;

const quotes = [
  { text: 'The journey of a thousand miles begins with a single step.', author: 'Lao Tzu' },

/* Web Audio Synthesizers for Micro-tasks */
function playTaskChime() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const notes = [
      { freq: 587.33, start: 0.00, dur: 0.09 },
      { freq: 880.00, start: 0.08, dur: 0.16 }
    ];
    notes.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(n.freq, ctx.currentTime + n.start);
      gain.gain.setValueAtTime(0.01, ctx.currentTime + n.start);
      gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + n.start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.start + n.dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + n.start);
      osc.stop(ctx.currentTime + n.start + n.dur);
    });
  } catch (e) {
    console.warn("Audio blocked or unsupported:", e);
  }
}

function playChoreChime() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(783.99, ctx.currentTime);
    gain.gain.setValueAtTime(0.01, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.24, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.38);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.38);
  } catch (e) {
    console.warn("Audio blocked or unsupported:", e);
  }
}

/* Fallback Synthesizer if MP3 fails */
function playFallbackFanfare() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const notes = [
      { freq: 261.63, start: 0.00, dur: 0.16 },
      { freq: 329.63, start: 0.18, dur: 0.16 },
      { freq: 392.00, start: 0.36, dur: 0.16 },
      { freq: 523.25, start: 0.54, dur: 0.75 }
    ];
    notes.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n.freq, ctx.currentTime + n.start);
      gain.gain.setValueAtTime(0, ctx.currentTime + n.start);
      gain.gain.linearRampToValueAtTime(0.28, ctx.currentTime + n.start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.start + n.dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + n.start);
      osc.stop(ctx.currentTime + n.start + n.dur);
    });
  } catch (e) {}
}

/* Plays the custom MP3 file with reference tracking */
function playFanfareSound() {
  try {
    if (activeCelebrationAudio) {
      activeCelebrationAudio.pause();
      activeCelebrationAudio.currentTime = 0;
    }
    const audio = new Audio(CELEBRATION_AUDIO_SRC);
    activeCelebrationAudio = audio;
    audio.play().catch(err => {
      console.warn("Could not play MP3 file, playing synth fallback:", err);
      playFallbackFanfare();
    });
  } catch (e) {
    playFallbackFanfare();
  }
}

function launchCelebration() {
  playFanfareSound();
  if (window.confetti) {
    const end = Date.now() + 2000;
    const interval = setInterval(() => {
      if (Date.now() > end) return clearInterval(interval);
      window.confetti({
        startVelocity: 35,
        spread: 360,
        ticks: 80,
        origin: { x: Math.random(), y: Math.random() - 0.2 }
      });
    }, 220);
  }
  const modal = document.getElementById('celebrateModal');
  if (modal) modal.classList.add('active');
}

window.closeCelebration = function() {
  const modal = document.getElementById('celebrateModal');
  if (modal) modal.classList.remove('active');
  if (activeCelebrationAudio) {
    activeCelebrationAudio.pause();
    activeCelebrationAudio.currentTime = 0;
    activeCelebrationAudio = null;
  }
};

function setSyncState(state) {
  const el = document.getElementById('syncStatus');
  if (!el || isReadOnly) return;
  el.classList.remove('hidden', 'sync-saving', 'sync-saved', 'sync-err');
  if (state === 'saving') {
    el.classList.add('sync-saving');
    el.textContent = 'Saving to cloud...';
  } else if (state === 'saved') {
    el.classList.add('sync-saved');
    el.textContent = 'Saved ✓';
    setTimeout(() => { el.classList.add('hidden'); }, 2000);
  } else if (state === 'error') {
    el.classList.add('sync-err');
    el.textContent = 'Sync failed ⚠';
  }
}

function sanitizeForFirestore(obj) {
  if (obj === undefined) return null;
  if (obj === null || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) {
    const arr = [];
    for (let i = 0; i < obj.length; i++) {
      arr[i] = sanitizeForFirestore(obj[i] === undefined ? null : obj[i]);
    }
    return arr;
  }
  const clean = {};
  for (const k of Object.keys(obj)) {
    clean[k] = sanitizeForFirestore(obj[k]);
  }
  return clean;
}

function init() {
  const urlParams = new URLSearchParams(window.location.search);
  const viewUid = urlParams.get('view');

  if (viewUid) {
    isReadOnly = true;
    targetUid = viewUid;
    applyModeUI();
    listenToCloud(targetUid);
  } else {
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        targetUid = user.uid;
        isReadOnly = false;
        applyModeUI();
        listenToCloud(user.uid);
      } else {
        targetUid = null;
        applyModeUI();
        render();
      }
    });
  }
}

  const addCatBtn = document.getElementById('addCatBtn');
  const resetBtn = document.getElementById('resetDayBtn');

window.handleAuth = function() {
  if (currentUser) {
    signOut(auth);
  } else {
    signInWithPopup(auth, provider).catch(err => alert("Sign-in error: " + err.message));
  }
};

function listenToCloud(uid) {
  if (unsubscribe) unsubscribe();
  const docRef = doc(db, "users", uid);
  unsubscribe = onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      data = docSnap.data();
      if (!data.days || typeof data.days !== 'object') data.days = {};
      localStorage.setItem('accountability_backup', JSON.stringify(data));
      render();
    } else if (!isReadOnly) {
      saveNow();
    }
  }, (err) => {
    console.error("Firestore error:", err);
    setSyncState('error');
  });
}

function saveNow() {
  if (isReadOnly) return;
  localStorage.setItem('accountability_backup', JSON.stringify(data));
  if (currentUser && targetUid) {
    setSyncState('saving');
    const docRef = doc(db, "users", targetUid);
    const cleanData = sanitizeForFirestore(data);
    setDoc(docRef, cleanData)
      .then(() => setSyncState('saved'))
      .catch(err => {
        console.error("Cloud save failed:", err);
        setSyncState('error');
      });
  }
}

function save() {
  if (isReadOnly) return;
  localStorage.setItem('accountability_backup', JSON.stringify(data));
  render();
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveNow, 250);
}

// Ensure each day is isolated in data.days[dateKey]
function getDayRecord(dateKey = selected) {
  if (!data.days[dateKey]) {
    data.days[dateKey] = {
      categories: createBlankDayCategories(),
      checks: {},
      flow: { morning: [''], noon: [''], evening: [''] }
    };
  }
  const day = data.days[dateKey];
  if (!Array.isArray(day.categories)) {
    day.categories = createBlankDayCategories();
  }
  if (!day.checks || typeof day.checks !== 'object') {
    day.checks = {};
  }
  if (!day.flow || typeof day.flow !== 'object') {
    day.flow = { morning: [''], noon: [''], evening: [''] };
  } else {
    ['morning', 'noon', 'evening'].forEach(slot => {
      if (typeof day.flow[slot] === 'string') {
        day.flow[slot] = day.flow[slot] ? [day.flow[slot]] : [''];
      }
      if (!Array.isArray(day.flow[slot]) || !day.flow[slot].length) {
        day.flow[slot] = [''];
      }
    });
  }
  return day;
}

window.selectDate = function(k) { selected = k; hasCelebratedToday = false; render(); };
window.goToday = function() { selected = new Date().toISOString().slice(0, 10); hasCelebratedToday = false; render(); };
window.shiftDate = function(n) {
  let d = new Date(selected + 'T12:00:00');
  d.setDate(d.getDate() + n);
  selected = d.toISOString().slice(0, 10);
  hasCelebratedToday = false;
  render();
};

function stats(k = selected) {
  const day = data.days[k];
  if (!day || !Array.isArray(day.categories)) return { t: 0, x: 0, p: 0 };

  const checks = day.checks || {};
  let t = 0, x = 0;

  day.categories.forEach((c, ci) => {
    if (c.name.trim().toLowerCase() === 'mock') return;
    (c.tasks || []).forEach((task, ti) => {
      t++;
      let entry = checks[ci]?.[ti];
      if (typeof entry === 'boolean') { if (entry) x++; }
      else if (entry?.done) { x++; }
      (c.subtasks?.[ti] || []).forEach((_, si) => {
        t++;
        if (entry?.sub?.[si]) x++;
      });
    });
  });
  return { t, x, p: t ? Math.round(x / t * 100) : 0 };
}

function renderQuote() {
  let seed = selected.split('-').reduce((a, v) => a + Number(v), 0);
  let q = quotes[seed % quotes.length];
  document.getElementById('quote').innerHTML = `<div class="quote-text">“${esc(q.text)}”</div><div class="quote-author">— ${esc(q.author)}</div><button class="quote-refresh" onclick="window.newQuote()">↻ &nbsp; New Quote</button>`;
}

window.newQuote = function() {
  let current = document.querySelector('.quote-text')?.textContent || '';
  let seed = Math.floor(Math.random() * quotes.length);
  let q = quotes[seed];
  if (current.includes(q.text) && quotes.length > 1) q = quotes[(seed + 1) % quotes.length];
  document.getElementById('quote').innerHTML = `<div class="quote-text">“${esc(q.text)}”</div><div class="quote-author">— ${esc(q.author)}</div><button class="quote-refresh" onclick="window.newQuote()">New quote</button>`;
};

function ensureStages() {
  const day = getDayRecord();
  (day.categories || []).forEach((c, ci) => {
    const cname = c.name.trim().toLowerCase();
    if (cname !== 'ga' && cname !== 'chores' && Array.isArray(c.tasks)) {
      day.checks[ci] ??= [];
      c.tasks.forEach((_, ti) => {
        const e = day.checks[ci][ti];
        if (e && typeof e === 'object' && !e.stage) e.stage = 'prelims';
      });
    }
    if (cname === 'mock' && Array.isArray(c.mocks)) {
      c.mocks.forEach(m => { if (!m.stage) m.stage = 'prelims'; });
    }
  });
}

window.setTaskStage = function(ci, ti, stage) {
  if (isReadOnly) return;
  const day = getDayRecord();
  const c = day.categories[ci];
  const cname = c?.name.trim().toLowerCase();
  if (!c || cname === 'ga' || cname === 'chores') return;
  day.checks[ci] ??= [];
  const cur = day.checks[ci][ti];
  day.checks[ci][ti] = (cur && typeof cur === 'object') ? cur : { done: !!cur };
  day.checks[ci][ti].stage = stage;
  save();
};

window.setMockStage = function(ci, mi, stage) {
  if (isReadOnly) return;
  const day = getDayRecord();
  const c = day.categories[ci];
  if (!c || c.name.trim().toLowerCase() !== 'mock' || !c.mocks?.[mi]) return;
  c.mocks[mi].stage = stage;
  save();
};

window.toggleStageMenu = function(id, event) {

};

/* Block Setup */
const TIME_BLOCKS = [
  { key: 'morning', label: 'Morning Block (6:00 – 10:00 AM)', tag: 'Morning (6-10 AM)' },
  { key: 'noon', label: 'Noon Block (10:00 AM – 1:30 PM)', tag: 'Noon (10-1:30 PM)' },
  { key: 'evening', label: 'Evening Block (5:00 – 9:00 PM)', tag: 'Evening (5-9 PM)' }
];

window.toggleBlockMenu = function(id, event) {
  if (isReadOnly) return;
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const menu = document.getElementById(id);
  if (!menu) return;
  const wasOpen = menu.classList.contains('open');
  document.querySelectorAll('.block-menu.open, .stage-menu.open').forEach(x => x.classList.remove('open'));
  if (!wasOpen) menu.classList.add('open');
};

window.setTaskBlock = function(ci, ti, block) {
  if (isReadOnly) return;
  const day = getDayRecord();
  day.checks[ci] ??= [];
  const cur = day.checks[ci][ti];
  day.checks[ci][ti] = (cur && typeof cur === 'object') ? cur : { done: !!cur };
  day.checks[ci][ti].block = block;
  save();
};

window.setSubtaskBlock = function(ci, ti, si, block) {
  if (isReadOnly) return;
  const day = getDayRecord();
  day.checks[ci] ??= [];
  let cur = day.checks[ci][ti];
  if (!cur || typeof cur !== 'object') cur = { done: !!cur, sub: [], subBlocks: {} };
  cur.subBlocks ??= {};
  cur.subBlocks[si] = block;
  day.checks[ci][ti] = cur;
  save();
};

function renderBlockTag(blockKey) {
  if (!blockKey) return '';
  const match = TIME_BLOCKS.find(b => b.key === blockKey);
  if (!match) return '';
  return `<span class="block-tag block-${blockKey}">${match.tag}</span>`;
}

window.updateFlowSlot = function(slot, idx, val) {
  if (isReadOnly) return;
  const day = getDayRecord();
  day.flow ??= { morning: [''], noon: [''], evening: [''] };
  day.flow[slot] ??= [''];
  day.flow[slot][idx] = val;
  save();
};

window.addFlowCategory = function(slot) {
  if (isReadOnly) return;
  const day = getDayRecord();
  day.flow ??= { morning: [''], noon: [''], evening: [''] };
  day.flow[slot] ??= [''];
  day.flow[slot].push('');
  save();
};

window.removeFlowCategory = function(slot, idx) {
  if (isReadOnly) return;
  const day = getDayRecord();
  day.flow ??= { morning: [''], noon: [''], evening: [''] };
  day.flow[slot] ??= [''];
  if (day.flow[slot].length <= 1) {
    day.flow[slot][0] = '';
  } else {
    day.flow[slot].splice(idx, 1);
  }
  save();
};

function renderFlow() {
  const day = getDayRecord();
  const flow = day.flow || { morning: [''], noon: [''], evening: [''] };
  const categories = (day.categories || []).map(c => c.name);

  const slots = [
    { key: 'morning', label: 'Morning Block', time: '6:00 – 10:00 AM' },
    { key: 'noon', label: 'Noon Block', time: '10:00 AM – 1:30 PM' },
    { key: 'evening', label: 'Evening Block', time: '5:00 – 9:00 PM' }
  ];

  let h = `
  <section class="flow-card">
    <div class="flow-head">
      <span>⏳ &nbsp;Flow of the Day</span>
    </div>
    <div class="flow-grid">`;

  slots.forEach(slot => {
    const list = Array.isArray(flow[slot.key]) && flow[slot.key].length ? flow[slot.key] : [''];
    h += `
      <div class="flow-slot">
        <div class="flow-slot-title">
          <span>${slot.label}</span>
          <span class="flow-slot-time">${slot.time}</span>
        </div>
        <div class="flow-items">`;
    list.forEach((val, idx) => {
      h += `
          <div class="flow-select-row">
            <select ${isReadOnly ? 'disabled' : ''} onchange="window.updateFlowSlot('${slot.key}', ${idx}, this.value)">
              <option value="">-- Choose Category --</option>
              ${categories.map(c => `<option value="${esc(c)}" ${val === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>
            ${(!isReadOnly && list.length > 1) ? `<button type="button" class="flow-del-btn" onclick="window.removeFlowCategory('${slot.key}', ${idx})" title="Remove">✕</button>` : ''}
          </div>`;
    });
    h += `</div>`;
    if (!isReadOnly) {
      h += `<button type="button" class="flow-add-btn" onclick="window.addFlowCategory('${slot.key}')">＋ Add category</button>`;
    }
    h += `</div>`;
  });

  h += `</div></section>`;
  document.getElementById('flowOfTheDay').innerHTML = h;
}

function render() {
  ensureStages();
  document.getElementById('date').value = selected;
  let s = stats();
  document.getElementById('pct').textContent = s.p + '%';
  document.getElementById('cnt').textContent = s.x + '/' + s.t;
  document.getElementById('fill').style.width = s.p + '%';
  renderQuote();
  renderFlow();

  // Trigger celebration on 100% completion
  if (s.t > 0 && s.p === 100) {
    if (!hasCelebratedToday && !isReadOnly) {
      hasCelebratedToday = true;
      launchCelebration();
    }
  } else {
    hasCelebratedToday = false;
  }

  const day = getDayRecord();
  let checks = day.checks || {};
  let h = '';
  const icons = ['▦', '◈', 'A', '✦', '◆', '★', '●', '▲'];

  (day.categories || []).forEach((c, ci) => {
    c.subtasks ??= {};
    const catNameLower = c.name.trim().toLowerCase();
    let isMock = catNameLower === 'mock';
    let isChores = catNameLower === 'chores';
    if (isMock) c.mocks ??= [];
    let catChecks = checks[ci] || [];
    let done = 0, total = 0;

    if (!isMock) {
      (c.tasks || []).forEach((_, ti) => {
        total++;
        let entry = catChecks[ti];
        if ((typeof entry === 'boolean' && entry) || (entry?.done)) done++;
        (c.subtasks?.[ti] || []).forEach((_, si) => {
          total++;
          if (entry?.sub?.[si]) done++;
        });
      });
    }

    let complete = total > 0 && done === total;
    let collapsed = c._collapsed === true;
    let mocks = Array.isArray(c.mocks) ? c.mocks : [];

    h += `<section class="cat">
      <div class="head">
        <span class="cat-icon">${complete ? '✓' : icons[ci % icons.length]}</span>
        <span class="name">${esc(c.name)}</span>
        <span class="count">${isMock ? mocks.length + ' mock' + (mocks.length === 1 ? '' : 's') : done + '/' + total}</span>
        ${!isReadOnly ? `<button onclick="window.rename(${ci})">Edit</button><button onclick="window.delCat(${ci})">×</button>` : ''}
        <button class="collapse" onclick="window.toggleCategory(${ci})">${collapsed ? '⌄' : '⌃'}</button>
      </div>`;

    if (!collapsed) {
      if (isMock) {
        h += `<div class="tasks">`;
        if (mocks.length) {
          h += `<div class="mock-list">`;
          mocks.forEach((m, mi) => {
            const done = !!m.done;
            h += `<div class="mock-card ${done ? 'mock-done' : ''}">
              <div class="mock-card-head">
                <label class="mock-check"><input type="checkbox" ${done ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''} onchange="window.toggleMock(${ci},${mi},this.checked)"><span>${done ? 'Given' : 'To give'}</span></label>
                <span class="mock-card-name">${esc(m.name || 'Untitled mock')}</span>
                ${!isReadOnly ? `<button type="button" class="mock-edit" onclick="window.editMock(${ci},${mi},event)">Edit</button>` : ''}
              </div>
              ${renderMockStage(ci, mi, m)}
              <div class="mock-card-meta">Marks: ${esc(m.marks || '—')} &nbsp; • &nbsp; Percentile: ${esc(m.percentile || '—')}</div>
              <div class="mock-subject-scores">`;
            (m.subjects || []).forEach(sub => {
              h += `<span class="mock-score"><b>${esc(sub.name || 'Subject')}</b>: ${esc(sub.score || '—')}</span>`;
            });
            h += `</div>`;
            if (m.remarks) h += `<div class="mock-remarks"><div class="mock-field"><label>Remarks</label><div class="mock-score">${esc(m.remarks)}</div></div></div>`;
            h += `</div>`;
          });
          h += `</div>`;
        } else {
          h += `<div class="empty-day-hint">No tests scheduled for this day.</div>`;
        }
        if (!isReadOnly) {
          h += `<div id="mock-add" class="mock-add-wrap"><button class="mock-add" type="button" onclick="window.openMockForm(event)">+ mock</button></div>`;
        }
        h += `</div>`;
      } else {
        h += `<div class="tasks">`;
        if (!c.tasks || !c.tasks.length) {
          h += `<div class="empty-day-hint">No tasks added for this day.</div>`;
        }
        (c.tasks || []).forEach((t, ti) => {
          let entry = catChecks[ti];
          let checked = typeof entry === 'boolean' ? entry : !!entry?.done;
          let subs = c.subtasks?.[ti] || [];
          let taskBlock = entry?.block || '';

          h += `<div class="task">
            <input type="checkbox" ${checked ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''} onchange="window.toggle(${ci},${ti},this.checked)">
            <span class="task-text ${checked ? 'done' : ''}" ${!isReadOnly ? `onclick="window.addSubcategory(${ci},${ti},event)"` : ''}>
              ${esc(t)}
              ${renderBlockTag(taskBlock)}
            </span>
            <span class="task-pct">${checked ? '100%' : '0%'}</span>
            ${!isReadOnly ? `
            <span class="task-actions">
              <button type="button" class="task-action" onclick="window.toggleBlockMenu('tb-menu-${ci}-${ti}', event)">Block</button>
              <div id="tb-menu-${ci}-${ti}" class="block-menu">
                ${TIME_BLOCKS.map(b => `<button type="button" class="block-opt" onclick="window.setTaskBlock(${ci},${ti},'${b.key}')">${b.label}</button>`).join('')}
                <button type="button" class="block-opt clear" onclick="window.setTaskBlock(${ci},${ti},'')">✕ Clear Block</button>
              </div>
              <button type="button" class="task-action" onclick="window.editTask(${ci},${ti},event)">Edit</button>
              <button type="button" class="task-action delete" onclick="window.deleteTask(${ci},${ti},event)">Delete</button>
            </span>` : ''}
          </div>`;
          h += renderTaskStage(ci, ti, entry);
          if (subs.length) {
            h += `<div class="subtasks">`;
            subs.forEach((st, si) => {
              let subdone = !!entry?.sub?.[si];
              let subText = typeof st === 'string' ? st : st.name || '';
              let subBlock = entry?.subBlocks?.[si] || '';

              if (isChores) {
                h += `<div class="subtask" style="justify-content:space-between;gap:8px;">
                  <span class="subtask-text ${subdone ? 'done' : ''}">${esc(subText)} ${renderBlockTag(subBlock)}</span>
                  <div style="display:flex;align-items:center;gap:5px;position:relative;">
                    <button type="button" class="chore-btn ${subdone ? 'done-btn' : ''}" ${isReadOnly ? 'disabled style="opacity:.6;cursor:default"' : `onclick="window.toggleSubcategory(${ci},${ti},${si},${!subdone})"`}>${subdone ? 'Completed ✓' : 'Done'}</button>
                    ${!isReadOnly ? `
                    <button type="button" class="task-action" onclick="window.toggleBlockMenu('sb-menu-${ci}-${ti}-${si}', event)">Block</button>
                    <div id="sb-menu-${ci}-${ti}-${si}" class="block-menu">
                      ${TIME_BLOCKS.map(b => `<button type="button" class="block-opt" onclick="window.setSubtaskBlock(${ci},${ti},${si},'${b.key}')">${b.label}</button>`).join('')}
                      <button type="button" class="block-opt clear" onclick="window.setSubtaskBlock(${ci},${ti},${si},'')">✕ Clear Block</button>
                    </div>
                    <button type="button" class="task-action" onclick="window.editSubcategory(${ci},${ti},${si},event)">Edit</button>
                    <button type="button" class="task-action delete" onclick="window.deleteSubcategory(${ci},${ti},${si},event)">Delete</button>
                    ` : ''}
                  </div>
                </div>`;
              } else {
                h += `<div class="subtask" style="justify-content:space-between;gap:8px;">
                  <label style="display:flex;align-items:center;gap:9px;flex:1;cursor:pointer;">
                    <input type="checkbox" ${subdone ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''} onchange="window.toggleSubcategory(${ci},${ti},${si},this.checked)">
                    <span class="subtask-text ${subdone ? 'done' : ''}">${esc(subText)}</span>
                    ${renderBlockTag(subBlock)}
                  </label>
                  ${!isReadOnly ? `
                  <div style="display:flex;align-items:center;gap:5px;position:relative;">
                    <button type="button" class="task-action" onclick="window.toggleBlockMenu('sb-menu-${ci}-${ti}-${si}', event)">Block</button>
                    <div id="sb-menu-${ci}-${ti}-${si}" class="block-menu">
                      ${TIME_BLOCKS.map(b => `<button type="button" class="block-opt" onclick="window.setSubtaskBlock(${ci},${ti},${si},'${b.key}')">${b.label}</button>`).join('')}
                      <button type="button" class="block-opt clear" onclick="window.setSubtaskBlock(${ci},${ti},${si},'')">✕ Clear Block</button>
                    </div>
                    <button type="button" class="task-action" onclick="window.editSubcategory(${ci},${ti},${si},event)">Edit</button>
                    <button type="button" class="task-action delete" onclick="window.deleteSubcategory(${ci},${ti},${si},event)">Delete</button>
                  </div>
                  ` : ''}
                </div>`;
              }
            });
            h += `</div>`;
          }
          if (!isReadOnly) {
            h += `<div id="subadd-${ci}-${ti}" class="subadd-wrap"><button class="subadd" type="button" onclick="window.addSubcategory(${ci},${ti},event)">+ subcategory</button></div>`;
          }
        });
        if (!isReadOnly) {
          h += `<div id="taskadd-${ci}" class="subadd-wrap"><button class="add" onclick="window.openTaskInput(${ci})">+ task</button></div>`;
        }
        h += `</div>`;
      }
    }
    h += `</section>`;
  });
  document.getElementById('app').innerHTML = h;
  renderHistory();
}

window.toggleCategory = function(ci) {
  const day = getDayRecord();
  day.categories[ci]._collapsed = !day.categories[ci]._collapsed;
  render();
};

window.openTaskInput = function(ci) {
  if (isReadOnly) return;
  const container = document.getElementById(`taskadd-${ci}`);
  if (!container || container.querySelector('input')) return;
  container.innerHTML = `
    <div class="subinput-row" style="margin:6px 0;">
      <input class="subinput" id="new-task-val-${ci}" type="text" placeholder="Enter task name..." autocomplete="off">
      <button type="button" class="subsave" onclick="window.saveNewTask(${ci})">Add</button>
      <button type="button" class="subcancel" onclick="render()">Cancel</button>
    </div>`;
  const el = document.getElementById(`new-task-val-${ci}`);
  el.focus();
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); window.saveNewTask(ci); }
    if (e.key === 'Escape') { e.preventDefault(); render(); }
  });
};

window.saveNewTask = function(ci) {
  const el = document.getElementById(`new-task-val-${ci}`);
  const title = el?.value.trim();
  if (!title) return;
  const day = getDayRecord();
  day.categories[ci].tasks.push(title);
  day.categories[ci].subtasks ??= {};
  save();
};

window.openMockForm = function(event, editCi = -1, editMi = -1) {
  if (isReadOnly) return;
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const wrap = document.getElementById('mock-add');
  if (!wrap || wrap.querySelector('input')) return;
  const day = getDayRecord();
  let existing = null;
  if (editCi >= 0 && editMi >= 0) existing = day.categories[editCi]?.mocks?.[editMi] || null;
  const subjects = (existing?.subjects && existing.subjects.length) ? existing.subjects : [{ name: 'English', score: '' }, { name: 'Maths', score: '' }, { name: 'Reasoning', score: '' }];
  const defaultsList = subjects.slice(0, 3);
  const extras = subjects.slice(3);
  wrap.innerHTML = `<div class="mock-entry-form">
    <div class="mock-top">
      <div class="mock-field"><label>Mock name</label><input id="mock-name" type="text" placeholder="e.g. Full Mock 1" autocomplete="off" value="${esc(existing?.name || '')}"></div>
      <div class="mock-field"><label>Marks <small>(fill after test)</small></label><input id="mock-marks" type="text" placeholder="e.g. 78.5" inputmode="decimal" value="${esc(existing?.marks || '')}"></div>
      <div class="mock-field"><label>Percentile <small>(fill after test)</small></label><input id="mock-percentile" type="text" placeholder="e.g. 92.4" inputmode="decimal" value="${esc(existing?.percentile || '')}"></div>
    </div>
    <div id="mock-subjects" class="mock-subjects">
      ${defaultsList.map((sub, i) => `<div class="mock-field"><label>${esc(sub.name || ['English', 'Maths', 'Reasoning'][i])}</label><input data-subject="${esc(sub.name || ['English', 'Maths', 'Reasoning'][i])}" type="text" placeholder="Marks (after test)" inputmode="decimal" value="${esc(sub.score || '')}"></div>`).join('')}
    </div>
    <button type="button" class="subject-add" onclick="window.addMockSubject()">+ add subject</button>
    ${extras.map(sub => `<div class="extra-subject-row"><input class="subinput" type="text" placeholder="Subject name" autocomplete="off" value="${esc(sub.name || '')}"><input class="subinput" type="text" placeholder="Marks" inputmode="decimal" value="${esc(sub.score || '')}"><button type="button" class="mockcancel" onclick="this.parentElement.remove()">×</button></div>`).join('')}
    <div class="mock-remarks">
      <div class="mock-field"><label>Remarks / What to improve</label><textarea id="mock-remarks" placeholder="What went wrong? What should I improve? Any notes about this test...">${esc(existing?.remarks || '')}</textarea></div>
    </div>
    <div class="mock-actions"><button type="button" class="mocksave" onclick="window.saveMock(${editCi},${editMi})">${existing ? 'Save changes' : 'Add mock'}</button><button type="button" class="mockcancel" onclick="window.cancelMock()">Cancel</button></div>
  </div>`;
  document.getElementById('mock-name').focus();
};

window.addMockSubject = function() {
  const box = document.getElementById('mock-subjects');
  if (!box) return;
  const row = document.createElement('div');
  row.className = 'extra-subject-row';
  row.innerHTML = `<input class="subinput" type="text" placeholder="Subject name" autocomplete="off"><input class="subinput" type="text" placeholder="Marks" inputmode="decimal"><button type="button" class="mockcancel" onclick="this.parentElement.remove()">×</button>`;
  box.appendChild(row);
  row.querySelector('input').focus();
};

window.saveMock = function(editCi = -1, editMi = -1) {
  if (isReadOnly) return;
  const get = id => document.getElementById(id)?.value.trim() || '';
  const name = get('mock-name'), marks = get('mock-marks'), percentile = get('mock-percentile');
  const remarks = get('mock-remarks');
  if (!name) { document.getElementById('mock-name')?.focus(); return; }
  const subjects = [];
  document.querySelectorAll('#mock-subjects [data-subject]').forEach(input => subjects.push({ name: input.dataset.subject, score: input.value.trim() }));
  document.querySelectorAll('#mock-subjects .extra-subject-row').forEach(row => {
    const inputs = row.querySelectorAll('input');
    const subject = inputs[0]?.value.trim() || '';
    const score = inputs[1]?.value.trim() || '';
    if (subject) subjects.push({ name: subject, score });
  });

  const day = getDayRecord();
  const mockCi = editCi >= 0 ? editCi : day.categories.findIndex(c => c.name.trim().toLowerCase() === 'mock');
  if (mockCi < 0) return;
  day.categories[mockCi].mocks ??= [];
  const record = {
    name, marks, percentile, subjects, remarks,
    done: editCi >= 0 ? !!day.categories[editCi].mocks[editMi]?.done : false,
    stage: editCi >= 0 ? (day.categories[editCi].mocks[editMi]?.stage || 'prelims') : 'prelims'
  };
  if (editCi >= 0 && editMi >= 0) day.categories[editCi].mocks[editMi] = record;
  else day.categories[mockCi].mocks.push(record);
  save();
};

window.toggleMock = function(ci, mi, v) {
  if (isReadOnly) return;
  const day = getDayRecord();
  day.categories[ci].mocks ??= [];
  if (!day.categories[ci].mocks[mi]) return;
  day.categories[ci].mocks[mi].done = !!v;
  if (v) playTaskChime();
  save();
};

window.editMock = function(ci, mi, event) {
  if (isReadOnly) return;
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const wrap = document.getElementById('mock-add');
  if (!wrap) return;
  wrap.innerHTML = '';
  window.openMockForm(null, ci, mi);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

window.cancelMock = function() {
  render();
};

window.addSubcategory = function(ci, ti, event) {
  if (isReadOnly) return;
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const wrap = document.getElementById(`subadd-${ci}-${ti}`);
  if (!wrap || wrap.querySelector('input')) return;
  wrap.innerHTML = `<div class="subinput-row"><input class="subinput" id="subinput-${ci}-${ti}" type="text" placeholder="Type subcategory..." autocomplete="off"><button type="button" class="subsave" onclick="window.saveSubcategory(${ci},${ti})">Add</button><button type="button" class="subcancel" onclick="cancelSubcategory(${ci},${ti})">Cancel</button></div>`;
  const input = document.getElementById(`subinput-${ci}-${ti}`);
  input.focus();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); window.saveSubcategory(ci, ti); }
    if (e.key === 'Escape') { e.preventDefault(); cancelSubcategory(ci, ti); }
  });
};

window.saveSubcategory = function(ci, ti) {
  if (isReadOnly) return;
  const input = document.getElementById(`subinput-${ci}-${ti}`);
  if (!input) return;
  const n = input.value.trim();
  if (!n) { input.focus(); return; }
  const day = getDayRecord();
  day.categories[ci].subtasks ??= {};
  day.categories[ci].subtasks[ti] ??= [];
  day.categories[ci].subtasks[ti].push(n);
  save();
};

function cancelSubcategory(ci, ti) {
  render();
}

window.editSubcategory = function(ci, ti, si, event) {
  if (isReadOnly) return;
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const day = getDayRecord();
  const subs = day.categories[ci]?.subtasks?.[ti];
  if (!subs || subs[si] == null) return;
  const oldText = typeof subs[si] === 'string' ? subs[si] : subs[si].name || '';
  const newText = prompt("Edit item name:", oldText);
  if (newText?.trim() && newText.trim() !== oldText) {
    if (typeof subs[si] === 'object') subs[si].name = newText.trim();
    else subs[si] = newText.trim();
    save();
  }
};

window.deleteSubcategory = function(ci, ti, si, event) {
  if (isReadOnly) return;
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const day = getDayRecord();
  const subs = day.categories[ci]?.subtasks?.[ti];
  if (!subs || subs[si] == null) return;
  const itemText = typeof subs[si] === 'string' ? subs[si] : subs[si].name || '';
  if (!confirm(`Delete "${itemText}"?`)) return;

  subs.splice(si, 1);
  const entry = day.checks?.[ci]?.[ti];
  if (entry && Array.isArray(entry.sub)) {
    entry.sub.splice(si, 1);
  }
  if (entry && entry.subBlocks && entry.subBlocks[si]) {
    delete entry.subBlocks[si];
  }
  save();
};

window.toggleSubcategory = function(ci, ti, si, v) {
  if (isReadOnly) return;
  const day = getDayRecord();
  day.checks[ci] ??= [];
  let entry = day.checks[ci][ti];
  if (typeof entry === 'boolean') entry = { done: entry, sub: [], subBlocks: {} };
  if (!entry) entry = { done: false, sub: [], subBlocks: {} };
  entry.sub ??= [];
  entry.sub[si] = v;
  day.checks[ci][ti] = entry;

  if (v) {
    const isChores = day.categories[ci]?.name.trim().toLowerCase() === 'chores';
    if (isChores) playChoreChime();
    else playTaskChime();
  }
  save();
};

window.toggle = function(ci, ti, v) {
  if (isReadOnly) return;
  const day = getDayRecord();
  day.checks[ci] ??= [];
  let entry = day.checks[ci][ti];
  if (entry && typeof entry === 'object') {
    entry.done = v;
    day.checks[ci][ti] = entry;
  } else {
    day.checks[ci][ti] = v;
  }

  if (v) playTaskChime();
  save();
};

window.addCategory = function() {
  if (isReadOnly) return;
  let n = prompt('Category name');
  if (n?.trim()) {
    const day = getDayRecord();
    let c = { name: n.trim(), tasks: [] };
    if (n.trim().toLowerCase() === 'mock') c.mocks = [];
    day.categories.push(c);
    save();
  }
};

window.editTask = function(ci, ti, event) {
  if (isReadOnly) return;
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const day = getDayRecord();
  const task = day.categories[ci]?.tasks?.[ti];
  if (task == null) return;
  const n = prompt('Change task name', task);
  if (n?.trim() && n.trim() !== task) {
    day.categories[ci].tasks[ti] = n.trim();
    save();
  }
};

window.deleteTask = function(ci, ti, event) {
  if (isReadOnly) return;
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const day = getDayRecord();
  const category = day.categories[ci];
  if (!category?.tasks?.[ti]) return;
  const taskName = category.tasks[ti];
  if (!confirm(`Delete "${taskName}" for ${selected}? This will also remove its subtasks.`)) return;

  category.tasks.splice(ti, 1);
  const oldSubs = category.subtasks || {};
  const newSubs = {};
  Object.keys(oldSubs).forEach(k => {
    const idx = Number(k);
    if (!Number.isInteger(idx)) return;
    if (idx < ti) newSubs[idx] = oldSubs[k];
    else if (idx > ti) newSubs[idx - 1] = oldSubs[k];
  });
  category.subtasks = newSubs;

  if (Array.isArray(day.checks?.[ci])) {
    day.checks[ci].splice(ti, 1);
  }

  save();
};

window.rename = function(ci) {
  if (isReadOnly) return;
  const day = getDayRecord();
  let n = prompt('Rename category', day.categories[ci].name);
  if (n?.trim()) { day.categories[ci].name = n.trim(); save(); }
};

window.delCat = function(ci) {
  if (isReadOnly) return;
  if (confirm('Delete this category for ' + selected + '?')) {
    const day = getDayRecord();
    day.categories.splice(ci, 1);
    delete day.checks[ci];
    save();
  }
};

window.resetDay = function() {
  if (isReadOnly) return;
  if (confirm('Reset this day (' + selected + ') back to an empty slate?')) {
    data.days[selected] = {
      categories: createBlankDayCategories(),
      checks: {},
      flow: { morning: [''], noon: [''], evening: [''] }
    };
    hasCelebratedToday = false;
    save();
  }
};

document.addEventListener('click', function() {
  document.querySelectorAll('.stage-menu.open, .block-menu.open').forEach(x => x.classList.remove('open'));
});

function renderHistory() {
  let keys = Object.keys(data.days).filter(k => {
    const d = data.days[k];
    if (!d || !Array.isArray(d.categories)) return false;
    const hasTasks = d.categories.some(c => (c.tasks && c.tasks.length > 0) || (c.mocks && c.mocks.length > 0));
    return hasTasks;
  }).sort().reverse();

  let h = '';
  if (!keys.length) h = '<div class="note">No completed-day records yet.</div>';
  keys.forEach(k => {
    let s = stats(k);
    h += `<div class="record"><button onclick="window.selectDate('${k}')">${k}</button><b>${s.p}% (${s.x}/${s.t})</b></div>`;
  });
  document.getElementById('history').innerHTML = h;
}

window.shareLiveLink = function() {
  if (!currentUser) {
    alert("Please sign in with Google first to generate your live partner link.");
    return;
  }
  const url = `${window.location.origin}${window.location.pathname}?view=${currentUser.uid}`;
  navigator.clipboard?.writeText(url);
  prompt("Copy this link and send to your partner on WhatsApp (View-only, no login required):", url);
};

window.backup = function() {
  let blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  let url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url;
  a.download = 'accountability-backup.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

window.restore = function() {
  if (isReadOnly) return;
  let i = document.createElement('input');
  i.type = 'file';
  i.accept = '.json,application/json';
  i.onchange = () => {
    if (!i.files[0]) return;
    let r = new FileReader();
    r.onload = () => {
      try {
        let restored = JSON.parse(r.result);
        if (!restored || typeof restored.days !== 'object') throw new Error();
        data = restored;
        save();
      } catch (e) {
        alert('Invalid backup file.');
      }
    };
    r.readAsText(i.files[0]);
  };
  i.click();
};

function esc(s) {
  return (s || '').toString().replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}

init();
</script>
</body>
</html>
